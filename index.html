<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人事異動看板｜前台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#1b2330; --ink-soft:#5b6677;
    --line:#e3e8ef; --line-strong:#cfd6e0; --accent:#0f6d6a; --accent-soft:#e3f1f0;
    --today:#fff7e8; --today-line:#f3c969;
    --shadow:0 1px 2px rgba(18,32,52,.05),0 8px 24px rgba(18,32,52,.06);
    /* 狀態色 */
    --s1-bg:#e7f6ec; --s1-fg:#137a45; --s1-dot:#1aa05a;   /* 新進 */
    --s2-bg:#fdeaea; --s2-fg:#b3261e; --s2-dot:#dc3a31;   /* 離職 */
    --s3-bg:#e8f1fd; --s3-fg:#1357b8; --s3-dot:#2a78e0;   /* 自提6% */
    --s4-bg:#fdf2e0; --s4-fg:#9a6300; --s4-dot:#e0921a;   /* 停繳6% */
    --s5-bg:#f0eafc; --s5-fg:#6b34c4; --s5-dot:#8b4ae6;   /* 眷屬加保 */
    --s6-bg:#def3f1; --s6-fg:#0c6b66; --s6-dot:#14a89f;
    --s7-bg:#fdebf2; --s7-fg:#b4256e; --s7-dot:#e0518f;
    --s8-bg:#eaecf6; --s8-fg:#3a3f8f; --s8-dot:#5a61c4;
    --s0-bg:#eef1f5; --s0-fg:#5b6677; --s0-dot:#94a3b8;   /* 其他 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Noto Sans TC","Sora",sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .num{font-family:"Sora",sans-serif;font-variant-numeric:tabular-nums}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 22px 60px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;
    display:grid;place-items:center;font-family:"Sora";font-weight:700;font-size:19px;box-shadow:var(--shadow)}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  .brand p{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
  .live .ping{width:8px;height:8px;border-radius:50%;background:#1aa05a;box-shadow:0 0 0 0 rgba(26,160,90,.5);animation:ping 1.8s infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(26,160,90,.45)}70%{box-shadow:0 0 0 7px rgba(26,160,90,0)}100%{box-shadow:0 0 0 0 rgba(26,160,90,0)}}

  .tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
  .tabs button{border:0;background:transparent;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);
    padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .tabs button.on{background:var(--accent);color:#fff}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:16px 0 12px}
  .monthnav{display:flex;align-items:center;gap:10px}
  .monthnav h2{font-family:"Sora";font-size:24px;font-weight:600;min-width:172px}
  .monthnav h2 small{font-size:14px;color:var(--ink-soft);font-weight:500;margin-left:4px}
  .btn{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;
    padding:8px 14px;border-radius:9px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.icon{padding:8px 11px;font-size:16px;line-height:1}
  .btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.solid:hover{filter:brightness(1.08);color:#fff}

  .legend{display:flex;flex-wrap:wrap;gap:7px}
  .lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-soft);
    background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
  .lg .dot{width:9px;height:9px;border-radius:50%}

  /* 月曆 */
  .calwrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);background:#f8fafc;border-bottom:1px solid var(--line)}
  .dow div{padding:11px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);text-align:left}
  .dow div.we{color:#c0392b}
  .grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .cell{min-height:148px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 8px 10px;
    display:flex;flex-direction:column;gap:5px;position:relative;background:var(--panel)}
  .cell:nth-child(7n){border-right:0}
  .cell.out{background:#fafbfc}
  .cell.out .dnum{color:#c2cad6}
  .cell.today{background:var(--today)}
  .cell.today .dnum{background:var(--today-line);color:#7a5400;border-radius:8px;padding:1px 8px}
  .dnum{font-family:"Sora";font-size:14px;font-weight:600;color:var(--ink);align-self:flex-start;line-height:1.6}
  .chips{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex:1;max-height:230px}
  .chips::-webkit-scrollbar{width:5px}.chips::-webkit-scrollbar-thumb{background:#d7dde6;border-radius:9px}
  .chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 7px;border-radius:7px;
    line-height:1.35;border:1px solid transparent;cursor:default}
  .chip .d{width:7px;height:7px;border-radius:50%;flex:none}
  .chip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .empty-day{font-size:11.5px;color:#c2cad6}

  /* 查詢檢視 */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
  .filters{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  .fld input,.fld select{font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line-strong);border-radius:9px;padding:9px 11px;min-width:150px}
  .fld input:focus,.fld select:focus{outline:0;border-color:var(--accent)}
  .statpick{display:flex;flex-wrap:wrap;gap:7px}
  .statpick label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;cursor:pointer;
    border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;user-select:none}
  .statpick label.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .statpick input{display:none}
  .statpick .d{width:9px;height:9px;border-radius:50%}

  .results{margin-top:18px}
  .rcount{font-size:13px;color:var(--ink-soft);margin-bottom:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:10px 12px;border-bottom:2px solid var(--line)}
  tbody td{padding:11px 12px;border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#f8fafc}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px}
  .tag .d{width:8px;height:8px;border-radius:50%}
  .co{font-family:"Sora";font-weight:600}
  .nm{font-weight:500}
  .none{text-align:center;color:var(--ink-soft);padding:40px 0;font-size:14px}

  footer{margin-top:26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
    font-size:12.5px;color:var(--ink-soft)}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}

  @media(max-width:720px){
    .cell{min-height:110px}
    .dow div{padding:8px 6px;font-size:11px}
    .monthnav h2{font-size:20px;min-width:140px}
    .chip{font-size:11px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">人</div>
      <div>
        <h1>人事異動看板</h1>
        <p>新進・離職・自提/停繳 6%・眷屬加保　即時同步</p>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="live"><span class="ping"></span>即時連線中</span>
      <div class="tabs">
        <button id="tabCal" class="on" onclick="switchView('cal')">月曆檢視</button>
        <button id="tabQuery" onclick="switchView('query')">區間查詢</button>
      </div>
    </div>
  </header>

  <!-- ===== 月曆檢視 ===== -->
  <section id="viewCal">
    <div class="toolbar">
      <div class="monthnav">
        <button class="btn icon" onclick="moveMonth(-1)">‹</button>
        <h2 id="monthTitle" class="num"></h2>
        <button class="btn icon" onclick="moveMonth(1)">›</button>
        <button class="btn" onclick="goToday()">今天</button>
      </div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="calwrap">
      <div class="dow">
        <div class="we">週日</div><div>週一</div><div>週二</div><div>週三</div><div>週四</div><div>週五</div><div class="we">週六</div>
      </div>
      <div class="grid" id="calGrid"></div>
    </div>
  </section>

  <!-- ===== 區間查詢 ===== -->
  <section id="viewQuery" style="display:none">
    <div class="panel">
      <div class="filters">
        <div class="fld">
          <label>起始日期</label>
          <input type="date" id="qFrom">
        </div>
        <div class="fld">
          <label>結束日期</label>
          <input type="date" id="qTo">
        </div>
        <div class="fld" style="flex:1;min-width:260px">
          <label>異動狀態（可複選，不選＝全部）</label>
          <div class="statpick" id="qStatus"></div>
        </div>
        <button class="btn solid" onclick="runQuery()">查詢</button>
        <button class="btn" onclick="resetQuery()">清除</button>
      </div>
      <div class="results">
        <div class="rcount" id="qCount"></div>
        <div id="qResult"></div>
      </div>
    </div>
  </section>

  <footer>
    <span>資料來源：人資部後台維護　·　異動以實際公司公告為準</span>
    <a href="admin.html">人資登入後台 →</a>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =========================================================
   ① Firebase 設定 —— 換成妳自己的專案設定
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBqBjrmODK4JUDv4GeQDqvQs8e7RsggXGc",
  authDomain: "yl-monthly-change.firebaseapp.com",
  projectId: "yl-monthly-change",
  storageBucket: "yl-monthly-change.firebasestorage.app",
  messagingSenderId: "899556010856",
  appId: "1:899556010856:web:464eb98f20f49fdfec84dd"
};

/* =========================================================
   ② 狀態設定 —— 預設值；實際清單由後台「狀態管理」維護，前台即時讀取
   ========================================================= */
const DEFAULT_STATUSES = [
  { name:"新進",     color:"--s1" },
  { name:"離職",     color:"--s2" },
  { name:"自提6%",   color:"--s3" },
  { name:"停繳6%",   color:"--s4" },
  { name:"眷屬加保", color:"--s5" },
  { name:"育嬰留停開始", color:"--s6" },
  { name:"育嬰留停結束", color:"--s7" }
];
let STATUSES = DEFAULT_STATUSES.slice();
const styleOf = (s)=>{ const f=STATUSES.find(x=>x.name===s); return f?f.color:"--s0"; };

/* ===== 初始化 ===== */
const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

let ALL = [];               // 全部異動資料
let cur = new Date();       // 目前月曆所在月份
cur.setDate(1);

/* ===== 狀態清單即時讀取 ===== */
onSnapshot(doc(db, "settings", "statuses"), (snap)=>{
  STATUSES = (snap.exists() && Array.isArray(snap.data().list) && snap.data().list.length)
    ? snap.data().list : DEFAULT_STATUSES.slice();
  buildLegend();
  renderCalendar();
  if(document.getElementById("viewQuery").style.display!=="none") runQuery();
}, ()=>{});

/* ===== 即時讀取 ===== */
onSnapshot(collection(db, "personnel_changes"), (snap)=>{
  ALL = snap.docs.map(d=>({ id:d.id, ...d.data() }));
  ALL.sort((a,b)=> (a.date||"").localeCompare(b.date||"") || (a.company||"").localeCompare(b.company||""));
  renderCalendar();
  if(document.getElementById("viewQuery").style.display!=="none") runQuery();
}, (err)=>{
  document.getElementById("calGrid").innerHTML =
    `<div style="padding:40px;grid-column:1/-1;color:#b3261e">讀取失敗：${err.message}<br>請確認 Firebase 設定與 Firestore 規則。</div>`;
});

/* ===== 月曆 ===== */
function renderCalendar(){
  const y=cur.getFullYear(), m=cur.getMonth();
  document.getElementById("monthTitle").innerHTML = `${y} <small>年</small> ${m+1} <small>月</small>`;
  const first=new Date(y,m,1), startDow=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const today=fmt(new Date());

  // 依日期分組
  const byDate={};
  ALL.forEach(it=>{ (byDate[it.date]=byDate[it.date]||[]).push(it); });

  const grid=document.getElementById("calGrid");
  grid.innerHTML="";
  const totalCells=Math.ceil((startDow+daysInMonth)/7)*7;
  for(let i=0;i<totalCells;i++){
    const dayN=i-startDow+1;
    const inMonth = dayN>=1 && dayN<=daysInMonth;
    const dObj=new Date(y,m,dayN);
    const ds=fmt(dObj);
    const cell=document.createElement("div");
    cell.className="cell"+(inMonth?"":" out")+(inMonth&&ds===today?" today":"");
    const items=inMonth?(byDate[ds]||[]):[];
    let chips="";
    if(inMonth){
      if(items.length){
        chips=`<div class="chips">`+items.map(it=>{
          const v=styleOf(it.status);
          return `<div class="chip" style="background:var(${v}-bg);color:var(${v}-fg);border-color:var(${v}-bg)" title="${esc(it.company)}-${esc(it.status)}-${esc(it.name)}${it.note?'｜'+esc(it.note):''}">
            <span class="d" style="background:var(${v}-dot)"></span>
            <span class="t">${esc(it.company)}-${esc(it.status)}-${esc(it.name)}</span>
          </div>`;
        }).join("")+`</div>`;
      } else {
        chips=`<div class="empty-day">—</div>`;
      }
    }
    cell.innerHTML=`<span class="dnum num">${dObj.getDate()}</span>${chips}`;
    grid.appendChild(cell);
  }
}

/* ===== 圖例 / 狀態選擇 ===== */
function buildLegend(){
  document.getElementById("legend").innerHTML = STATUSES.map(s=>
    `<span class="lg"><span class="dot" style="background:var(${s.color}-dot)"></span>${esc(s.name)}</span>`).join("");
  document.getElementById("qStatus").innerHTML = STATUSES.map(s=>
    `<label data-s="${esc(s.name)}"><input type="checkbox" value="${esc(s.name)}"><span class="d" style="background:var(${s.color}-dot)"></span>${esc(s.name)}</label>`).join("");
  document.querySelectorAll("#qStatus label").forEach(l=>{
    l.addEventListener("click",()=> setTimeout(()=> l.classList.toggle("on", l.querySelector("input").checked),0));
  });
}

/* ===== 查詢 ===== */
window.runQuery=function(){
  const from=document.getElementById("qFrom").value;
  const to  =document.getElementById("qTo").value;
  const picked=[...document.querySelectorAll("#qStatus input:checked")].map(i=>i.value);
  let rows=ALL.filter(it=>{
    if(from && (it.date||"")<from) return false;
    if(to   && (it.date||"")>to)   return false;
    if(picked.length && !picked.includes(it.status)) return false;
    return true;
  });
  const c=document.getElementById("qCount");
  const box=document.getElementById("qResult");
  c.textContent = `共 ${rows.length} 筆異動`+(from||to?`　（${from||'最早'} ～ ${to||'最新'}）`:"");
  if(!rows.length){ box.innerHTML=`<div class="none">此條件下沒有異動紀錄</div>`; return; }
  box.innerHTML=`<table><thead><tr><th>日期</th><th>公司</th><th>部門</th><th>狀態</th><th>姓名</th><th>備註</th></tr></thead><tbody>`+
    rows.map(it=>{const v=styleOf(it.status);return `<tr>
      <td class="num">${esc(it.date)}</td>
      <td class="co">${esc(it.company)}</td>
      <td>${esc(it.dept||"")}</td>
      <td><span class="tag" style="background:var(${v}-bg);color:var(${v}-fg)"><span class="d" style="background:var(${v}-dot)"></span>${esc(it.status)}</span></td>
      <td class="nm">${esc(it.name)}</td>
      <td style="color:var(--ink-soft)">${esc(it.note||"")}</td>
    </tr>`;}).join("")+`</tbody></table>`;
};
window.resetQuery=function(){
  document.getElementById("qFrom").value="";
  document.getElementById("qTo").value="";
  document.querySelectorAll("#qStatus input").forEach(i=>i.checked=false);
  document.querySelectorAll("#qStatus label").forEach(l=>l.classList.remove("on"));
  runQuery();
};

/* ===== 檢視切換 / 月份切換 ===== */
window.switchView=function(v){
  const cal=v==="cal";
  document.getElementById("viewCal").style.display=cal?"":"none";
  document.getElementById("viewQuery").style.display=cal?"none":"";
  document.getElementById("tabCal").classList.toggle("on",cal);
  document.getElementById("tabQuery").classList.toggle("on",!cal);
  if(!cal) runQuery();
};
window.moveMonth=function(n){ cur.setMonth(cur.getMonth()+n); renderCalendar(); };
window.goToday=function(){ cur=new Date(); cur.setDate(1); renderCalendar(); };

/* ===== 工具 ===== */
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

buildLegend();
renderCalendar();
</script>
</body>
</html>
