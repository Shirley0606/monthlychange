<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人事異動看板｜後台維護</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#1b2330; --ink-soft:#5b6677;
    --line:#e3e8ef; --line-strong:#cfd6e0; --accent:#0f6d6a; --accent-soft:#e3f1f0;
    --shadow:0 1px 2px rgba(18,32,52,.05),0 8px 24px rgba(18,32,52,.06);
    --s1-bg:#e7f6ec;--s1-fg:#137a45;--s1-dot:#1aa05a;
    --s2-bg:#fdeaea;--s2-fg:#b3261e;--s2-dot:#dc3a31;
    --s3-bg:#e8f1fd;--s3-fg:#1357b8;--s3-dot:#2a78e0;
    --s4-bg:#fdf2e0;--s4-fg:#9a6300;--s4-dot:#e0921a;
    --s5-bg:#f0eafc;--s5-fg:#6b34c4;--s5-dot:#8b4ae6;
    --s0-bg:#eef1f5;--s0-fg:#5b6677;--s0-dot:#94a3b8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Noto Sans TC","Sora",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .num{font-family:"Sora";font-variant-numeric:tabular-nums}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 22px 60px}

  /* 登入 */
  .loginbg{min-height:100vh;display:grid;place-items:center;padding:24px}
  .loginbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
    width:100%;max-width:380px;padding:34px 30px}
  .loginbox .mark{width:48px;height:48px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;
    font-family:"Sora";font-weight:700;font-size:21px;margin-bottom:16px}
  .loginbox h1{font-size:20px;font-weight:700}
  .loginbox p{font-size:13px;color:var(--ink-soft);margin:4px 0 22px}
  .loginbox label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px}
  .loginbox input{width:100%;font-family:inherit;font-size:14px;border:1px solid var(--line-strong);border-radius:9px;padding:11px 12px}
  .loginbox input:focus{outline:0;border-color:var(--accent)}
  .err{color:#b3261e;font-size:12.5px;margin-top:12px;min-height:16px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:13px}
  .brand .mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:"Sora";font-weight:700;font-size:19px}
  .brand h1{font-size:20px;font-weight:700}
  .brand p{font-size:12.5px;color:var(--ink-soft)}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--ink-soft)}

  .btn{border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;
    padding:9px 15px;border-radius:9px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.solid:hover{filter:brightness(1.08);color:#fff}
  .btn.solid:disabled{opacity:.55;cursor:not-allowed;filter:none}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.danger{color:#b3261e;border-color:#f1c7c4}
  .btn.danger:hover{background:#fdeaea;border-color:#dc3a31}

  .grid2{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  @media(max-width:880px){.grid2{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
  .panel h2{font-size:15px;font-weight:700;margin-bottom:4px}
  .panel .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px}

  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
  .fld input,.fld select,.fld textarea{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:#fff;
    border:1px solid var(--line-strong);border-radius:9px;padding:10px 11px}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent)}
  .fld textarea{resize:vertical;min-height:54px}
  .formmsg{font-size:13px;margin-top:6px;min-height:18px}
  .formmsg.ok{color:#137a45}.formmsg.bad{color:#b3261e}

  .filterbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
  .filterbar .fld{margin:0}
  .filterbar input,.filterbar select{min-width:130px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-soft);padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:#f8fafc}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .tag .d{width:8px;height:8px;border-radius:50%}
  .co{font-family:"Sora";font-weight:600}
  .none{text-align:center;color:var(--ink-soft);padding:36px 0;font-size:14px}
  .rcount{font-size:13px;color:var(--ink-soft);margin:2px 0 12px}
  .actions{display:flex;gap:6px}
  .tablescroll{overflow-x:auto}
  .deptchips{display:flex;flex-wrap:wrap;gap:8px}
  .deptchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;
    background:var(--accent-soft);color:var(--accent);border:1px solid #bfe0de;padding:6px 8px 6px 13px;border-radius:999px}
  .deptchip button{border:0;background:#bfe0de;color:#0b504e;width:18px;height:18px;border-radius:50%;
    cursor:pointer;font-size:13px;line-height:1;display:grid;place-items:center;padding:0}
  .deptchip button:hover{background:#dc3a31;color:#fff}
  .deptempty{font-size:13px;color:var(--ink-soft);padding:6px 0}

  footer{margin-top:24px;font-size:12.5px;color:var(--ink-soft);display:flex;gap:16px}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div id="loginScreen" class="loginbg">
  <div class="loginbox">
    <div class="mark">人</div>
    <h1>人資後台登入</h1>
    <p>請使用人資部帳號登入維護異動資料</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="hr@company.com" autocomplete="username">
    <label>密碼</label>
    <input type="password" id="loginPw" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter')doLogin()">
    <div class="err" id="loginErr"></div>
    <button class="btn solid" style="width:100%;margin-top:8px;justify-content:center" onclick="doLogin()">登入</button>
  </div>
</div>

<!-- ===== 後台主畫面 ===== -->
<div id="adminScreen" class="wrap" style="display:none">
  <header class="top">
    <div class="brand">
      <div class="mark">人</div>
      <div><h1>人事異動後台</h1><p>新增 / 編輯 / 刪除異動紀錄</p></div>
    </div>
    <div class="who">
      <span id="userEmail"></span>
      <a class="btn sm" href="index.html">回前台看板</a>
      <button class="btn sm" onclick="doLogout()">登出</button>
    </div>
  </header>

  <div class="grid2">
    <!-- 新增/編輯表單 -->
    <div class="panel">
      <h2 id="formTitle">新增異動</h2>
      <div class="sub" id="formSub">選擇日期、公司、狀態並輸入姓名</div>
      <div class="fld">
        <label>異動日期</label>
        <input type="date" id="fDate">
      </div>
      <div class="fld">
        <label>所屬公司</label>
        <select id="fCompany" onchange="onCompanyChange()"></select>
      </div>
      <div class="fld">
        <label>部門（選填）</label>
        <select id="fDept"></select>
      </div>
      <div class="fld">
        <label>異動狀態</label>
        <select id="fStatus"></select>
      </div>
      <div class="fld">
        <label>姓名</label>
        <input type="text" id="fName" placeholder="例：江承澔">
      </div>
      <div class="fld">
        <label>備註（選填）</label>
        <textarea id="fNote" placeholder="例：眷屬2人、轉調WH…"></textarea>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn solid" id="saveBtn" style="flex:1;justify-content:center" onclick="saveEntry()">儲存</button>
        <button class="btn" id="cancelBtn" style="display:none" onclick="cancelEdit()">取消編輯</button>
      </div>
      <div class="formmsg" id="formMsg"></div>
    </div>

    <!-- 紀錄列表 -->
    <div class="panel">
      <h2>異動紀錄</h2>
      <div class="sub">可依日期、公司、部門、狀態、姓名篩選</div>
      <div class="filterbar">
        <div class="fld"><label>起始</label><input type="date" id="flFrom" onchange="renderList()"></div>
        <div class="fld"><label>結束</label><input type="date" id="flTo" onchange="renderList()"></div>
        <div class="fld"><label>公司</label><select id="flCompany" onchange="renderList()"></select></div>
        <div class="fld"><label>部門</label><select id="flDept" onchange="renderList()"></select></div>
        <div class="fld"><label>狀態</label><select id="flStatus" onchange="renderList()"></select></div>
        <div class="fld" style="flex:1;min-width:140px"><label>姓名</label><input type="text" id="flName" placeholder="搜尋姓名" oninput="renderList()"></div>
        <button class="btn sm" onclick="clearFilter()">清除</button>
      </div>
      <div class="rcount" id="listCount"></div>
      <div class="tablescroll">
        <table>
          <thead><tr><th>日期</th><th>公司</th><th>部門</th><th>狀態</th><th>姓名</th><th>備註</th><th>操作</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 部門管理 -->
  <div class="panel" style="margin-top:20px">
    <h2>部門管理</h2>
    <div class="sub">新增或刪除各公司的部門，建立異動資料時即可從下拉選用（即時同步給所有人資）</div>
    <div class="filterbar" style="margin-bottom:14px">
      <div class="fld"><label>公司</label><select id="dmCompany" onchange="renderDeptManager()"></select></div>
      <div class="fld" style="flex:1;min-width:180px"><label>新增部門名稱</label>
        <input type="text" id="dmName" placeholder="例：工務部" onkeydown="if(event.key==='Enter')addDept()"></div>
      <button class="btn solid" onclick="addDept()">新增部門</button>
    </div>
    <div id="dmList"></div>
    <div class="formmsg" id="dmMsg"></div>
  </div>

  <footer>
    <span>異動資料即時同步至前台看板</span>
    <a href="index.html">前台看板 →</a>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* =========================================================
   ① Firebase 設定 —— 與前台 index.html 相同
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBqBjrmODK4JUDv4GeQDqvQs8e7RsggXGc",
  authDomain: "yl-monthly-change.firebaseapp.com",
  projectId: "yl-monthly-change",
  storageBucket: "yl-monthly-change.firebasestorage.app",
  messagingSenderId: "899556010856",
  appId: "1:899556010856:web:464eb98f20f49fdfec84dd"
};

/* =========================================================
   ② 公司清單 —— 改成貴公司實際代碼/名稱
   ========================================================= */
const COMPANIES = ["YL", "WH", "LT"];

/* =========================================================
   ②-2 Google Sheet 即時彙總 —— 貼上 Apps Script Web App 網址
        （部署步驟見 README；留空字串則不同步到試算表）
   ========================================================= */
const SHEET_SYNC_URL = "";

/* =========================================================
   ③ 狀態設定 —— 與前台一致
   ========================================================= */
const STATUS_LIST = [
  { name:"新進",     v:"--s1" },
  { name:"離職",     v:"--s2" },
  { name:"自提6%",   v:"--s3" },
  { name:"停繳6%",   v:"--s4" },
  { name:"眷屬加保", v:"--s5" }
];
const styleOf=(s)=>{const f=STATUS_LIST.find(x=>x.name===s);return f?f.v:"--s0";};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const COL="personnel_changes";
const DEPT_DOC=doc(db,"settings","departments");   // 部門清單（各公司）

let ALL=[];          // 全部資料
let editingId=null;  // 正在編輯的 doc id
let DEPTS={};        // 部門：{ 公司: [部門,...] }

/* ===== 即時推送到 Google Sheet（寫入成功後呼叫，失敗不影響存檔）===== */
function syncToSheet(action, payload){
  if(!SHEET_SYNC_URL) return;
  const body = action==="delete"
    ? { action:"delete", id:payload }
    : { action:"upsert", record:payload };
  try{
    fetch(SHEET_SYNC_URL, {
      method:"POST",
      mode:"no-cors",                                   // Apps Script 跨網域用 no-cors
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
  }catch(e){ console.warn("Sheet 同步失敗（資料已存入 Firebase）：", e); }
}
const nowTW = ()=> new Date().toLocaleString("zh-TW",{ timeZone:"Asia/Taipei", hour12:false });

/* ===== 登入狀態 ===== */
onAuthStateChanged(auth,(user)=>{
  if(user){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("adminScreen").style.display="";
    document.getElementById("userEmail").textContent=user.email;
    subscribe();
    subscribeDepts();
  }else{
    document.getElementById("loginScreen").style.display="";
    document.getElementById("adminScreen").style.display="none";
  }
});

window.doLogin=async function(){
  const email=document.getElementById("loginEmail").value.trim();
  const pw=document.getElementById("loginPw").value;
  const err=document.getElementById("loginErr");
  err.textContent="";
  try{ await signInWithEmailAndPassword(auth,email,pw); }
  catch(e){ err.textContent=mapErr(e.code); }
};
window.doLogout=()=>signOut(auth);
function mapErr(c){
  const m={"auth/invalid-email":"Email 格式錯誤","auth/user-not-found":"查無此帳號",
    "auth/wrong-password":"密碼錯誤","auth/invalid-credential":"帳號或密碼錯誤","auth/too-many-requests":"嘗試次數過多，請稍後再試"};
  return m[c]||("登入失敗："+c);
}

/* ===== 即時讀取 ===== */
let unsub=null;
function subscribe(){
  if(unsub) return;
  unsub=onSnapshot(collection(db,COL),(snap)=>{
    ALL=snap.docs.map(d=>({id:d.id,...d.data()}));
    ALL.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (a.company||"").localeCompare(b.company||""));
    renderList();
  });
}

/* ===== 部門清單即時讀取 ===== */
let unsubDept=null;
function subscribeDepts(){
  if(unsubDept) return;
  unsubDept=onSnapshot(DEPT_DOC,(snap)=>{
    DEPTS = (snap.exists() && snap.data().byCompany) ? snap.data().byCompany : {};
    onCompanyChange();          // 重新整理表單部門下拉
    fillDeptFilter();           // 重新整理篩選部門下拉
    renderDeptManager();        // 重新整理部門管理清單
    renderList();
  });
}

// 取某公司的部門陣列（已排序去重）
function deptsOf(company){ return (DEPTS[company]||[]).slice().sort(); }

// 表單：公司改變時，重填部門下拉
window.onCompanyChange=function(){
  const company=document.getElementById("fCompany").value;
  const cur=document.getElementById("fDept").value;
  const list=deptsOf(company);
  document.getElementById("fDept").innerHTML=
    `<option value="">（不指定）</option>`+list.map(d=>`<option>${esc(d)}</option>`).join("");
  if(list.includes(cur)) document.getElementById("fDept").value=cur;   // 盡量保留原選擇
};

// 篩選：部門下拉（全部公司部門的聯集）
function fillDeptFilter(){
  const all=[...new Set(Object.values(DEPTS).flat())].sort();
  const sel=document.getElementById("flDept"); const cur=sel.value;
  sel.innerHTML=`<option value="">全部部門</option>`+all.map(d=>`<option>${esc(d)}</option>`).join("");
  if(all.includes(cur)) sel.value=cur;
}

/* ===== 部門管理 ===== */
window.addDept=async function(){
  const company=document.getElementById("dmCompany").value;
  const name=document.getElementById("dmName").value.trim();
  const msg=document.getElementById("dmMsg"); msg.className="formmsg";
  if(!company){ msg.className="formmsg bad"; msg.textContent="請先選擇公司"; return; }
  if(!name){ msg.className="formmsg bad"; msg.textContent="請輸入部門名稱"; return; }
  const list=DEPTS[company]||[];
  if(list.includes(name)){ msg.className="formmsg bad"; msg.textContent="此部門已存在"; return; }
  const next={...DEPTS, [company]:[...list, name]};
  try{
    await setDoc(DEPT_DOC,{byCompany:next},{merge:true});
    document.getElementById("dmName").value="";
    msg.className="formmsg ok"; msg.textContent=`已新增部門：${company} / ${name}`;
    setTimeout(()=>{ msg.textContent=""; },2500);
  }catch(e){ msg.className="formmsg bad"; msg.textContent="新增失敗："+e.message; }
};

window.delDept=async function(company,name){
  const used=ALL.filter(it=>it.company===company && it.dept===name).length;
  const warn=used>0 ? `\n\n注意：已有 ${used} 筆異動使用此部門，刪除後那些紀錄的部門欄位仍會保留文字，但下拉將不再出現此選項。` : "";
  if(!confirm(`確定刪除部門「${company} / ${name}」？${warn}`)) return;
  const next={...DEPTS, [company]:(DEPTS[company]||[]).filter(d=>d!==name)};
  try{ await setDoc(DEPT_DOC,{byCompany:next},{merge:true}); }
  catch(e){ alert("刪除失敗："+e.message); }
};

function renderDeptManager(){
  const company=document.getElementById("dmCompany").value;
  const box=document.getElementById("dmList");
  if(!company){ box.innerHTML=`<div class="deptempty">請選擇公司以管理其部門</div>`; return; }
  const list=deptsOf(company);
  if(!list.length){ box.innerHTML=`<div class="deptempty">「${esc(company)}」目前沒有部門，於上方新增。</div>`; return; }
  box.innerHTML=`<div class="deptchips">`+list.map(d=>
    `<span class="deptchip">${esc(d)}<button title="刪除" onclick="delDept('${esc(company)}','${esc(d).replace(/'/g,"\\'")}')">×</button></span>`
  ).join("")+`</div>`;
}

/* ===== 表單儲存（新增 / 更新）===== */
window.saveEntry=async function(){
  const date=document.getElementById("fDate").value;
  const company=document.getElementById("fCompany").value;
  const dept=document.getElementById("fDept").value;
  const status=document.getElementById("fStatus").value;
  const name=document.getElementById("fName").value.trim();
  const note=document.getElementById("fNote").value.trim();
  const msg=document.getElementById("formMsg");
  const btn=document.getElementById("saveBtn");
  msg.className="formmsg";
  if(!date||!company||!status||!name){ msg.className="formmsg bad"; msg.textContent="請完整填寫日期、公司、狀態、姓名"; return; }
  btn.disabled=true;
  try{
    const data={date,company,dept,status,name,note,updatedAt:serverTimestamp(),updatedBy:auth.currentUser?.email||""};
    if(editingId){
      await updateDoc(doc(db,COL,editingId),data);
      syncToSheet("upsert",{ id:editingId, date, company, dept, status, name, note, updatedBy:data.updatedBy, updatedAt:nowTW() });
      msg.className="formmsg ok"; msg.textContent="已更新：" + `${company}-${status}-${name}`;
      cancelEdit();
    }else{
      data.createdAt=serverTimestamp();
      const ref=await addDoc(collection(db,COL),data);
      syncToSheet("upsert",{ id:ref.id, date, company, dept, status, name, note, updatedBy:data.updatedBy, updatedAt:nowTW() });
      msg.className="formmsg ok"; msg.textContent="已新增：" + `${company}-${status}-${name}`;
      document.getElementById("fName").value="";
      document.getElementById("fNote").value="";
    }
  }catch(e){ msg.className="formmsg bad"; msg.textContent="儲存失敗："+e.message; }
  finally{ btn.disabled=false; setTimeout(()=>{ if(msg.classList.contains("ok"))msg.textContent=""; },3500); }
};

window.editEntry=function(id){
  const it=ALL.find(x=>x.id===id); if(!it) return;
  editingId=id;
  document.getElementById("fDate").value=it.date||"";
  document.getElementById("fCompany").value=it.company||"";
  onCompanyChange();                                     // 依公司填入部門下拉
  document.getElementById("fDept").value=it.dept||"";
  document.getElementById("fStatus").value=it.status||"";
  document.getElementById("fName").value=it.name||"";
  document.getElementById("fNote").value=it.note||"";
  document.getElementById("formTitle").textContent="編輯異動";
  document.getElementById("formSub").textContent="修改後按儲存即更新";
  document.getElementById("saveBtn").textContent="更新";
  document.getElementById("cancelBtn").style.display="";
  window.scrollTo({top:0,behavior:"smooth"});
};
window.cancelEdit=function(){
  editingId=null;
  document.getElementById("formTitle").textContent="新增異動";
  document.getElementById("formSub").textContent="選擇日期、公司、狀態並輸入姓名";
  document.getElementById("saveBtn").textContent="儲存";
  document.getElementById("cancelBtn").style.display="none";
  document.getElementById("fName").value="";
  document.getElementById("fNote").value="";
  onCompanyChange();
};

window.delEntry=async function(id){
  const it=ALL.find(x=>x.id===id); if(!it) return;
  if(!confirm(`確定刪除這筆異動？\n\n${it.date}　${it.company}-${it.status}-${it.name}`)) return;
  try{ await deleteDoc(doc(db,COL,id)); syncToSheet("delete",id); if(editingId===id) cancelEdit(); }
  catch(e){ alert("刪除失敗："+e.message); }
};

/* ===== 列表 + 篩選 ===== */
window.renderList=function(){
  const from=document.getElementById("flFrom").value;
  const to=document.getElementById("flTo").value;
  const co=document.getElementById("flCompany").value;
  const dp=document.getElementById("flDept").value;
  const st=document.getElementById("flStatus").value;
  const nm=document.getElementById("flName").value.trim();
  let rows=ALL.filter(it=>{
    if(from && (it.date||"")<from) return false;
    if(to   && (it.date||"")>to)   return false;
    if(co   && it.company!==co)     return false;
    if(dp   && (it.dept||"")!==dp)  return false;
    if(st   && it.status!==st)      return false;
    if(nm   && !(it.name||"").includes(nm)) return false;
    return true;
  });
  document.getElementById("listCount").textContent=`共 ${rows.length} 筆`;
  const body=document.getElementById("listBody");
  if(!rows.length){ body.innerHTML=`<tr><td colspan="7"><div class="none">沒有符合條件的紀錄</div></td></tr>`; return; }
  body.innerHTML=rows.map(it=>{const v=styleOf(it.status);return `<tr>
    <td class="num">${esc(it.date)}</td>
    <td class="co">${esc(it.company)}</td>
    <td>${esc(it.dept||"")}</td>
    <td><span class="tag" style="background:var(${v}-bg);color:var(${v}-fg)"><span class="d" style="background:var(${v}-dot)"></span>${esc(it.status)}</span></td>
    <td>${esc(it.name)}</td>
    <td style="color:var(--ink-soft);max-width:200px">${esc(it.note||"")}</td>
    <td><div class="actions">
      <button class="btn sm" onclick="editEntry('${it.id}')">編輯</button>
      <button class="btn sm danger" onclick="delEntry('${it.id}')">刪除</button>
    </div></td>
  </tr>`;}).join("");
};
window.clearFilter=function(){
  ["flFrom","flTo","flName"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("flCompany").value="";
  document.getElementById("flDept").value="";
  document.getElementById("flStatus").value="";
  renderList();
};

/* ===== 初始化下拉 ===== */
function initSelects(){
  document.getElementById("fCompany").innerHTML=
    `<option value="">請選擇</option>`+COMPANIES.map(c=>`<option>${esc(c)}</option>`).join("");
  document.getElementById("fStatus").innerHTML=
    `<option value="">請選擇</option>`+STATUS_LIST.map(s=>`<option>${esc(s.name)}</option>`).join("");
  document.getElementById("flCompany").innerHTML=
    `<option value="">全部公司</option>`+COMPANIES.map(c=>`<option>${esc(c)}</option>`).join("");
  document.getElementById("flStatus").innerHTML=
    `<option value="">全部狀態</option>`+STATUS_LIST.map(s=>`<option>${esc(s.name)}</option>`).join("");
  document.getElementById("dmCompany").innerHTML=
    `<option value="">請選擇</option>`+COMPANIES.map(c=>`<option>${esc(c)}</option>`).join("");
  document.getElementById("fDept").innerHTML=`<option value="">（不指定）</option>`;
  document.getElementById("flDept").innerHTML=`<option value="">全部部門</option>`;
  document.getElementById("fDate").value=new Date().toISOString().slice(0,10);
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

initSelects();
</script>
